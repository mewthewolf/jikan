[package]
name = "jikan-desktop"
version = "0.1.0"
description = "Tauri desktop shell for Jikan"
authors = ["mewthewolf"]
edition = "2021"

[lib]
name = "jikan_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8.2", features = [] }
